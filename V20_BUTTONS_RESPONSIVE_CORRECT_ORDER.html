<script>
// V11 — desbloqueio compatível com Google Sites/iframes: sem prompt/alert
const SENHA_ADMIN = "1234";
const CHAVE_AUTH = "galeriaV20AdminAuth";
function estaAutenticado(){
  try{ const o=JSON.parse(localStorage.getItem(CHAVE_AUTH)||"null"); return !!(o&&o.ok&&Date.now()-o.time<86400000); }catch(e){ return false; }
}
function mostrarAdmin(){
  const sub=document.getElementById('subTabsInjected'); if(sub) sub.style.display='block';
  document.querySelectorAll('button').forEach(b=>{const t=(b.textContent||'').trim(); if(t==='Galeria'||t==='Administrador'){const q=b.closest('div'); if(q) q.style.display='flex'; b.style.display='inline-block';}});
}
function esconderAdmin(){
  const sub=document.getElementById('subTabsInjected'); if(sub) sub.style.display='none';
  document.querySelectorAll('button').forEach(b=>{const t=(b.textContent||'').trim(); if(t==='Galeria'||t==='Administrador') b.style.display='none';});
}
function fecharSenhaV11(){const m=document.getElementById('v20PasswordModal');if(m)m.remove();}
function pedirSenha(){
  try{window.pedirSenha=pedirSenha;window.estaAutenticado=estaAutenticado;}catch(e){}
  if(document.getElementById('v20PasswordModal')) return true;
  const m=document.createElement('div'); m.id='v20PasswordModal';
  m.innerHTML=`<div class="v20pm-card"><div class="v20pm-title">Administrador</div><div class="v20pm-sub">Digite a senha para continuar</div><input id="v20pm-input" type="password" inputmode="numeric" autocomplete="off" aria-label="Senha do Administrador"><div id="v20pm-msg" class="v20pm-msg"></div><div class="v20pm-actions"><button id="v20pm-cancel" type="button">Cancelar</button><button id="v20pm-ok" type="button">Entrar</button></div></div>`;
  document.body.appendChild(m);
  const input=m.querySelector('#v20pm-input'), msg=m.querySelector('#v20pm-msg');
  const ok=()=>{const v=input.value;if(v===SENHA_ADMIN){try{localStorage.setItem(CHAVE_AUTH,JSON.stringify({ok:true,time:Date.now()}));}catch(e){}fecharSenhaV11();mostrarAdmin();const be=document.getElementById('btnEditor');if(be)be.click();window.scrollTo(0,document.body.scrollHeight);}else{msg.textContent='Senha incorreta';input.select();}};
  m.querySelector('#v20pm-ok').addEventListener('click',ok); m.querySelector('#v20pm-cancel').addEventListener('click',fecharSenhaV11);
  input.addEventListener('keydown',e=>{if(e.key==='Enter')ok();if(e.key==='Escape')fecharSenhaV11();});
  m.addEventListener('click',e=>{if(e.target===m)fecharSenhaV11();});
  requestAnimationFrame(()=>input.focus()); return true;
}
(function(){
  const css=document.createElement('style');css.textContent=`#v20PasswordModal{position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box;touch-action:manipulation}#v20PasswordModal .v20pm-card{width:min(390px,100%);background:#18181b;border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6);color:#fff;font-family:system-ui,sans-serif;box-sizing:border-box}.v20pm-title{font-size:24px;font-weight:800}.v20pm-sub{color:#a1a1aa;margin:6px 0 16px}.v20pm-card input{width:100%;height:52px;background:#09090b;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:0 14px;font-size:20px;box-sizing:border-box;outline:none}.v20pm-msg{height:22px;margin-top:7px;color:#f87171;font-size:14px}.v20pm-actions{display:flex;gap:10px;margin-top:8px}.v20pm-actions button{flex:1;border:0;border-radius:999px;padding:13px;font-weight:800;font-size:15px;touch-action:manipulation}.v20pm-actions #v20pm-cancel{background:#27272a;color:#fff}.v20pm-actions #v20pm-ok{background:#fff;color:#000}`;document.head.appendChild(css);
})();
(function(){
  const url=new URL(location.href), has=url.searchParams.has('admin');
  setTimeout(()=>{if(!estaAutenticado()&&!has)esconderAdmin();else if(has&&!estaAutenticado())pedirSenha();else mostrarAdmin();},800);
  document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='a'){e.preventDefault();estaAutenticado()?mostrarAdmin():pedirSenha();}});
})();
</script>

<script id="V20-V11-COLUNAS-JS">
(function(){'use strict';
 const KEY='v20GalleryColumns',DEFAULT=2;let btn,menu,open=false,lastApplied=0;
 const read=()=>{try{const n=Number(localStorage.getItem(KEY));return [1,2,3,4].includes(n)?n:DEFAULT}catch(e){return DEFAULT}};
 function findBox(){const all=[...document.querySelectorAll('.columns-2,[style*="column-count"]')];return all.find(x=>!x.closest('#v20AdminTabs')&&x.querySelector&&x.querySelector('img'))||null}
 function apply(n){const box=findBox();if(box){box.style.setProperty('column-count',n,'important');box.style.setProperty('-webkit-column-count',n,'important');box.dataset.v20Columns=n;lastApplied=n}if(btn)btn.textContent='▦ '+n;if(menu)menu.querySelectorAll('button').forEach(x=>x.classList.toggle('ativo',x.dataset.cols==n));requestAnimationFrame(()=>{requestAnimationFrame(()=>{window.v20RefreshActionButtons&&window.v20RefreshActionButtons()})});}
 function place(){if(!btn||!menu)return;const h=btn.getBoundingClientRect();menu.style.right='12px';menu.style.top=(h.bottom+7)+'px';}

<style id="v20-adaptive-action-buttons">
.v20-gallery-title{
  width:100%!important;

.v20-gallery-action-btn{
  flex:1 1 0!important;
  width:0!important;
  min-width:0!important;
  max-width:none!important;
  height:32px!important;
  min-height:32px!important;
  max-height:32px!important;
  padding:3px 5px!important;
  margin:0!important;
  box-sizing:border-box!important;
  border-radius:8px!important;
  overflow:hidden!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  text-align:center!important;
  white-space:nowrap!important;
  line-height:12px!important;
  font-size:10px!important;
  font-weight:600!important
}
.v20-gallery-action-nova{background:#27272a!important;color:#fff!important;border:1px solid rgba(255,255,255,.1)!important}

  flex-direction:column!important;
  align-items:center!important;
  justify-content:center!important;
  width:100%!important;
  min-width:0!important;
  overflow:hidden!important;
  line-height:10px!important
}
.v20-gallery-action-similar>span>span{
  display:block!important;
  max-width:100%!important;
  overflow:hidden!important;
  text-overflow:ellipsis!important;
  white-space:nowrap!important
}
.v20-gallery-action-link{
  flex:0 0 32px!important;
  width:32px!important;
  min-width:32px!important;
  max-width:32px!important;
  height:32px!important;
  min-height:32px!important;
  max-height:32px!important;
  padding:0!important;
  margin:0!important;
  box-sizing:border-box!important;
  border-radius:9999px!important;
  background:#27272a!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.1)!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  overflow:hidden!important;

}

<script>
(function(){
  const TITLE_KEY = 'tituloGaleriaV20';
  const TITLE_DEFAULT = 'Galeria visitante — 2 colunas Pinterest';
  const HTML_KEY = 'v20HtmlPendente';

  function toast(msg){
    const old=document.getElementById('v20-toast');
    if(old) old.remove();
    const t=document.createElement('div');
    t.id='v20-toast';
    t.textContent=msg;
    t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:999999;background:#fff;color:#000;padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)';
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),2200);
  }

  function getFullHtml(){
    const state=window.__V20_CURRENT_STATE__||{};
    let customTitle='';
    try{customTitle=localStorage.getItem(TITLE_KEY)||'';}catch(e){}
    const payload={items:Array.isArray(state.items)?state.items:[],status:state.status||'',customTitle};
    const marker='<script id=\"v20-export-state\">window.__V20_IMPORTED_STATE__='+JSON.stringify(payload).replace(/<\/script/gi,'<\\/script')+';\<\/script>';
    let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    if(/<\/head>/i.test(html)) html=html.replace(/<\/head>/i,marker+'</head>');
    else html=marker+html;
    return html;
  }

  function getGalleryTitleElement(){
    const candidates=document.querySelectorAll('h1,h2,[role="heading"]');
    for(const el of candidates){
      if(el.closest('#v20AdminTabs')) continue;
      const text=(el.textContent||'').trim();
      if(text===TITLE_DEFAULT || el.dataset.v20GalleryTitle==='true') return el;
    }
    return null;
  }

  function applySavedTitle(){
    let title='';
    try{title=(window.__V20_IMPORTED_STATE__&&window.__V20_IMPORTED_STATE__.customTitle)||localStorage.getItem(TITLE_KEY)||'';}catch(e){}
    if(!title) return;
    const el=getGalleryTitleElement();
    if(el){el.textContent=title;el.dataset.v20GalleryTitle='true';}
  }

  function setupAdminTabs(){
    const adminH2=Array.from(document.querySelectorAll('h2')).find(h=>(h.textContent||'').includes('Administrador'));
    if(!adminH2) return false;
    const adminContainer=adminH2.parentElement;
    const grid=adminContainer && adminContainer.querySelector('.grid');
    if(!grid) return false;
    const old=document.getElementById('v20AdminTabs');
    if(old && old.parentElement===adminContainer) return true;
    if(old) old.remove();

    const wrapper=document.createElement('div');
    wrapper.id='v20AdminTabs';
    wrapper.innerHTML=`
      <div style="margin-bottom:16px">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
          <button id="v20BtnEditor" type="button" style="padding:12px 20px;border-radius:9999px;font-size:16px;font-weight:700;background:white;color:black;border:1px solid white;cursor:pointer">Editar título</button>
          <button id="v20BtnHtml" type="button" style="padding:12px 20px;border-radius:9999px;font-size:16px;font-weight:700;background:#27272a;color:white;border:1px solid rgba(255,255,255,.15);cursor:pointer">HTML</button>
          <button id="v20FaceDots" type="button" style="padding:12px 20px;border-radius:9999px;font-size:16px;font-weight:700;background:#27272a;color:white;border:1px solid rgba(255,255,255,.15);cursor:pointer">Detectar rostos</button>
        </div>
        <div id="v20EditorTab"></div>
        <div id="v20HtmlTab" style="display:none">
          <div style="background:#18181b;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px">
            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">
              <button id="v20Copy" type="button" style="padding:14px 24px;border-radius:9999px;background:#27272a;color:white;border:1px solid rgba(255,255,255,.12);font-size:16px;font-weight:700;cursor:pointer">Copiar HTML</button>
              <button id="v20Paste" type="button" style="padding:14px 24px;border-radius:9999px;background:#27272a;color:white;border:1px solid rgba(255,255,255,.12);font-size:16px;font-weight:700;cursor:pointer">Colar HTML</button>
              <button id="v20Download" type="button" style="padding:14px 24px;border-radius:9999px;background:#27272a;color:white;border:1px solid rgba(255,255,255,.12);font-size:16px;font-weight:700;cursor:pointer">Baixar Arquivo Html</button>
            </div>
            <div id="v20HtmlStatus" style="min-height:24px;text-align:center;color:#a1a1aa;font-size:13px;margin-bottom:14px"></div>
            <div style="background:#101012;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:18px">
              <h3 style="font-size:24px;font-weight:800;text-align:center;margin:0 0 18px">Área para visualizar o código html</h3>
              <textarea id="v20HtmlViewer" readonly style="display:block;width:100%;height:420px;box-sizing:border-box;background:#050505;color:#a1a1aa;border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;resize:vertical;outline:none"></textarea>
              <div id="v20HtmlMeta" style="text-align:center;color:#71717a;font-size:12px;margin-top:10px"></div>
            </div>
          </div>
        </div>
      </div>`;

    adminH2.style.display='none';
    adminContainer.insertBefore(wrapper,adminContainer.firstChild);
    const editor=wrapper.querySelector('#v20EditorTab');
    const htmlTab=wrapper.querySelector('#v20HtmlTab');
    const btnEditor=wrapper.querySelector('#v20BtnEditor');
    const btnHtml=wrapper.querySelector('#v20BtnHtml');
    const viewer=wrapper.querySelector('#v20HtmlViewer');
    const meta=wrapper.querySelector('#v20HtmlMeta');
    const status=wrapper.querySelector('#v20HtmlStatus');
    const faceDotsBtn=wrapper.querySelector('#v20FaceDots');

    // Experimental test: real face detection only. No pixel/skin-tone fallback and no clothing detection. Canonical face dots are stored in original-image coordinates; display layers handle their own crop/contain transform.
    // The MediaPipe model is loaded only when the administrator presses the button, so normal gallery
    // usage and lighter devices are not burdened by the model until this test is explicitly requested.
    let v20FaceDetectorPromise=null;
    async function v20LoadFaceDetector(){
      if(v20FaceDetectorPromise) return v20FaceDetectorPromise;
      v20FaceDetectorPromise=(async()=>{
        const mod=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm');
        const vision=await mod.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm');
        // Use the official browser API path: createFromModelPath + IMAGE mode.
        const detector=await mod.FaceDetector.createFromModelPath(
          vision,
          'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_full_range/float16/1/blaze_face_full_range.tflite'
        );
        detector.setOptions({
          runningMode:'IMAGE',
          minDetectionConfidence:0.35,
          minSuppressionThreshold:0.30
        });
        return detector;
      })().catch(err=>{v20FaceDetectorPromise=null;throw err;});
      return v20FaceDetectorPromise;
    }

    async function v20DetectFacesOnly(){
      if(!faceDotsBtn || faceDotsBtn.dataset.busy==='1') return;
      faceDotsBtn.dataset.busy='1';
      faceDotsBtn.disabled=true;
      faceDotsBtn.textContent='Carregando detector...';
      try{
        // Keep the exact gallery state that the stable V20 uses. Prefer the
        // imported state when present, then persisted state, then the window hook.
        let persisted=null;
        try{
          const raw=localStorage.getItem('v20GalleryState');
          if(raw) persisted=JSON.parse(raw);
        }catch(e){}
        let state=(window.__V20_IMPORTED_STATE__ && Array.isArray(window.__V20_IMPORTED_STATE__.items))
          ? window.__V20_IMPORTED_STATE__
          : (persisted && Array.isArray(persisted.items) ? persisted : (window.__V20_CURRENT_STATE__||{}));
        const items=Array.isArray(state.items)?JSON.parse(JSON.stringify(state.items)):[];
        if(!items.length){toast('Nenhuma foto para analisar');return;}

        const detector=await v20LoadFaceDetector();
        let added=0,processed=0,failed=0,faces=0,projected=0;
        const loadImage=src=>new Promise((resolve,reject)=>{
          const img=new Image();
          img.crossOrigin='anonymous';
          img.referrerPolicy='no-referrer';
          img.onload=()=>resolve(img);
          img.onerror=()=>reject(new Error('Falha ao carregar imagem'));
          img.src=src;
        });

        for(let idx=0;idx<items.length;idx++){
          const item=items[idx];
          const src=item.url||item.src||item.image||item.imageUrl||'';
          if(!src){failed++;continue;}
          let img;
          try{img=await loadImage(src);}catch(e){failed++;continue;}
          try{
            const result=detector.detect(img);
            const detections=Array.isArray(result?.detections)?result.detections:[];
            // Rebuild only the automatic face dots on each detector run.
            // Manual dots (head/body/cloth) are preserved. This prevents an
            // earlier coordinate projection from contaminating the new test.
            const existing=Array.isArray(item.dots)
              ? item.dots.filter(d=>{
                  const id=String(d?.id||'');
                  const label=String(d?.label||'').toLowerCase();
                  return !id.startsWith('face_head_') && !label.startsWith('auto-face');
                })
              : [];
            const fresh=[];

            detections.forEach((det,di)=>{
              const box=det?.boundingBox;
              if(!box || !img.naturalWidth || !img.naturalHeight) return;
              faces++;

              // V20.1: use BlazeFace's facial reference points instead of the
              // center of the square/rectangular face box. FaceDetector returns
              // normalized keypoints (eyes, nose, mouth, ears). For a visual
              // "center of the face", use the two-eye midpoint together with
              // nose and mouth. This keeps the dot on the actual facial area.
              const kp=Array.isArray(det?.keypoints)?det.keypoints:[];
              const named={};
              kp.forEach(k=>{
                const label=String(k?.label||k?.name||'').toLowerCase();
                if(Number.isFinite(Number(k?.x))&&Number.isFinite(Number(k?.y))){
                  named[label]={x:Number(k.x)*img.naturalWidth,y:Number(k.y)*img.naturalHeight};
                }
              });
              const rightEye=named['right_eye']||named['right eye'];
              const leftEye=named['left_eye']||named['left eye'];
              const nose=named['nose_tip']||named['nose tip']||named['nose'];
              const mouth=named['mouth_center']||named['mouth center']||named['mouth'];
              const refs=[];
              if(rightEye && leftEye) refs.push({
                x:(rightEye.x+leftEye.x)/2,
                y:(rightEye.y+leftEye.y)/2,
                w:1.0
              });
              if(nose) refs.push({...nose,w:1.25});
              if(mouth) refs.push({...mouth,w:0.75});

              // BlazeFace supplies these keypoints, so the normal path never
              // uses the bounding-box center. The box remains only as a
              // defensive fallback for unusual model/API results.
              let sx,sy;
              if(refs.length){
                const tw=refs.reduce((a,r)=>a+r.w,0);
                sx=refs.reduce((a,r)=>a+r.x*r.w,0)/tw;
                sy=refs.reduce((a,r)=>a+r.y*r.w,0)/tw;
              }else{
                sx=Number(box.originX)+Number(box.width)/2;
                sy=Number(box.originY)+Number(box.height)/2;
              }
              if(!Number.isFinite(sx)||!Number.isFinite(sy)) return;

              // IMPORTANT: store the dot in SOURCE coordinates only.
              // Do not project it into a gallery crop here. Each visual surface
              // (administrator preview, gallery card, full-image view) can have
              // a different aspect ratio/crop. Keeping one canonical source
              // coordinate prevents the same dot from being transformed twice.
              const W=img.naturalWidth, H=img.naturalHeight;
              let xPct=sx/W*100;
              let yPct=sy/H*100;

              xPct=Math.max(0,Math.min(100,xPct));
              yPct=Math.max(0,Math.min(100,yPct));

              projected++;
              const score=Array.isArray(det.categories)&&det.categories[0]&&typeof det.categories[0].score==='number'
                ? det.categories[0].score : null;
              const near=[...existing,...fresh].some(d=>d.tipo==='head'&&Math.hypot(Number(d.x)-xPct,Number(d.y)-yPct)<6);
              if(!near){
                fresh.push({
                  id:'face_head_'+Date.now()+'_'+idx+'_'+di,
                  label:score===null?'auto-face':`auto-face ${Math.round(score*100)}%`,
                  tipo:'head',x:xPct,y:yPct
                });
                added++;
              }
            });

            if(fresh.length) item.dots=[...existing,...fresh];
            processed++;
          }catch(e){
            console.error('face detect photo',idx,e);
            failed++;
          }
          await new Promise(r=>setTimeout(r,20));
          faceDotsBtn.textContent=`Rostos ${idx+1}/${items.length}`;
        }

        // Merge instead of replacing unrelated V20 state fields.
        const finalState=Object.assign({}, persisted||{}, state||{}, {items});
        localStorage.setItem('v20GalleryState',JSON.stringify(finalState));

        toast(added>0
          ? `Detecção concluída • ${added} novos dots • ${faces} rostos • ${projected} projetados • ${processed} fotos`+(failed?` • ${failed} falhas`:'')
          : `0 novos dots • ${faces} rostos detectados • ${projected} projetados • ${processed} fotos`+(failed?` • ${failed} falhas`:''));
        setTimeout(()=>location.reload(),1200);
      }catch(e){
        console.error('V20 face detection:',e);
        toast('Erro no detector facial: '+(e?.message||'verifique a internet'));
      }finally{
        faceDotsBtn.dataset.busy='0';
        faceDotsBtn.disabled=false;
        faceDotsBtn.textContent='Detectar rostos';
      }
    }
    faceDotsBtn.onclick=v20DetectFacesOnly;

    // Move the existing admin grid into the Editor tab. This preserves the original admin controls.
    editor.appendChild(grid);

    const titleBox=document.createElement('div');
    titleBox.style.cssText='background:#18181b;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px;margin-bottom:16px';
    titleBox.innerHTML=`<div style="color:#a1a1aa;font-weight:800;font-size:16px;margin-bottom:10px">Título da Galeria</div><div style="display:flex;gap:8px"><input id="v20TitleInput" type="text" placeholder="Digite o título personalizado" style="flex:1;min-width:0;background:#09090b;color:white;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:13px;font-size:15px;outline:none"><button id="v20ApplyTitle" type="button" style="padding:0 16px;background:white;color:black;border-radius:12px;font-weight:800;cursor:pointer">Aplicar título</button></div>`;
    editor.insertBefore(titleBox,editor.firstChild);
    const titleInput=titleBox.querySelector('#v20TitleInput');
    let saved='';try{saved=(window.__V20_IMPORTED_STATE__&&window.__V20_IMPORTED_STATE__.customTitle)||localStorage.getItem(TITLE_KEY)||'';}catch(e){}
    titleInput.value=saved;
    function applyTitle(){
      const v=titleInput.value.trim();
      if(!v) return;
      try{localStorage.setItem(TITLE_KEY,v);}catch(e){}
      applySavedTitle();
      toast('Título atualizado com sucesso');
    }
    titleBox.querySelector('#v20ApplyTitle').onclick=applyTitle;
    titleInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();applyTitle();}});

    function refreshViewer(){
      const html=getFullHtml();
      viewer.value=html;
      meta.textContent='Pronto • '+(html.length/1024).toFixed(1).replace('.',',')+' KB • '+html.length.toLocaleString('pt-BR')+' caracteres';
    }

    function htmlMode(){editor.style.display='none';htmlTab.style.display='block';btnHtml.style.background='white';btnHtml.style.color='black';btnEditor.style.background='#27272a';btnEditor.style.color='white';refreshViewer();}

    btnHtml.onclick=htmlMode;

      status.textContent='Copiado com sucesso';
      refreshViewer();
    };

    wrapper.querySelector('#v20Download').onclick=()=>{
      const html=getFullHtml(); viewer.value=html;
      const blob=new Blob([html],{type:'text/html;charset=utf-8'});
      const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='GPT_V20.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
      status.textContent='Download bem sucedido';
      refreshViewer();
    };

    wrapper.querySelector('#v20Paste').onclick=async()=>{
      // Abre uma área grande própria para colagem. Em arquivos HTML abertos
      // localmente, o Chrome pode bloquear navigator.clipboard.readText().

      modal.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box';
      modal.innerHTML=`
        <div style="width:min(920px,100%);max-height:92vh;background:#18181b;border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
          <div style="font-size:24px;font-weight:800;color:white">Colar HTML</div>
          <div id="v20PasteHelp" style="color:#a1a1aa;font-size:14px;line-height:1.45">Cole aqui o código HTML da galeria. Se o acesso automático à área de transferência estiver disponível, vou preenchê-lo automaticamente.</div>
          <textarea id="v20PasteArea" spellcheck="false" placeholder="Toque aqui e escolha Colar" style="width:100%;height:min(52vh,520px);box-sizing:border-box;background:#050505;color:#e4e4e7;border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:16px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;resize:vertical;outline:none"></textarea>
          <div id="v20PasteStatus" style="min-height:22px;color:#a1a1aa;font-size:13px"></div>
          <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
            <button id="v20PasteCancel" type="button" style="padding:12px 20px;border-radius:9999px;background:#27272a;color:white;border:1px solid rgba(255,255,255,.12);font-size:15px;font-weight:700">Cancelar</button>
            <button id="v20PasteApply" type="button" style="padding:12px 20px;border-radius:9999px;background:white;color:black;border:1px solid white;font-size:15px;font-weight:800">Atualizar galeria</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
      const area=modal.querySelector('#v20PasteArea');
      const help=modal.querySelector('#v20PasteHelp');
      const st=modal.querySelector('#v20PasteStatus');
      modal.querySelector('#v20PasteCancel').onclick=()=>modal.remove();
      modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
      area.focus();

      // Primeiro tenta a leitura automática, mas nunca depende dela.
      try{
        if(navigator.clipboard && typeof navigator.clipboard.readText==='function'){
          const clip=await navigator.clipboard.readText();
          if(clip && clip.trim()){
            area.value=clip;

          } else {
            st.textContent='Área de transferência vazia. Toque no campo e escolha “Colar”.';
          }
        } else {
          st.textContent='Toque no campo e escolha “Colar” para inserir o HTML.';
        }
      }catch(e){
        st.textContent='O navegador bloqueou a leitura automática. Toque no campo e escolha “Colar”.';
        area.focus();
      }

      modal.querySelector('#v20PasteApply').onclick=()=>{
        const html=area.value;
        if(!html.trim()){
          st.textContent='Nenhum HTML foi inserido.';
          area.focus();
          return;
        }
        if(!/<(?:!doctype|html|body|div|script|style)\b/i.test(html)){
          st.textContent='Código HTML inválido.';
          return;
        }
        try{localStorage.setItem(HTML_KEY,html);}catch(e){}
        try{sessionStorage.setItem('v20PasteSuccess','1');}catch(e){}
        const boot=`<script>(function(){try{sessionStorage.setItem('v20PasteSuccess','1')}catch(e){}})();<\/script>`;
        let doc=html;
        if(/<head(\s[^>]*)?>/i.test(doc)) doc=doc.replace(/<head(\s[^>]*)?>/i,m=>m+boot);
        else if(/<body(\s[^>]*)?>/i.test(doc)) doc=doc.replace(/<body(\s[^>]*)?>/i,m=>m+boot);
        else doc=boot+doc;
        modal.remove();
        document.open();document.write(doc);document.close();
      };
    };

    editorMode();
    try{
      if(sessionStorage.getItem('v20PasteSuccess')==='1'){
        sessionStorage.removeItem('v20PasteSuccess');
        setTimeout(()=>toast('Galeria atualizada com sucesso'),350);
      }
    }catch(e){}
    return true;
  }

  // Reapply the saved title only when returning to the gallery; no MutationObserver is used.
  setInterval(()=>{
    applySavedTitle();
    setupAdminTabs();
  },700);

  window.addEventListener('load',()=>{setTimeout(()=>{
    applySavedTitle();
    try{if(localStorage.getItem('v20PasteSuccess')==='1'){localStorage.removeItem('v20PasteSuccess');toast('Galeria atualizada com sucesso');}}catch(e){}
  },250);});
})();
</script>

<script>
(function(){
'use strict';
var taps=0,lastTap=0,timer=0;
function abrirSenha(){
  try{
    if(typeof window.pedirSenha==='function') return window.pedirSenha();
  }catch(e){}
  return false;
}
function ehTitulo(el){
  var n=el;
  for(var i=0;n&&n!==document.body&&i<12;i++,n=n.parentElement){
    var txt=(n.textContent||'').trim();
    if(n.tagName==='H1' && (/Galeria visitante/i.test(txt)||/Galeria V20/i.test(txt))) return true;
    if(n.getAttribute && n.getAttribute('data-v20-gallery-title')==='true') return true;
    if(n.dataset && n.dataset.v20GalleryTitle==='true') return true;
  }
  return false;
}
function marcar(){
  document.querySelectorAll('h1').forEach(function(h){
    var t=(h.textContent||'').trim();
    if(/Galeria visitante/i.test(t)||/Galeria V20/i.test(t)){
      h.setAttribute('data-v20-gallery-title','true');
      h.style.touchAction='none';
      h.style.webkitUserSelect='none';
      h.style.userSelect='none';
      h.style.webkitTapHighlightColor='transparent';
    }
  });
}
function toque(e){
  if(!ehTitulo(e.target)) return;
  try{e.preventDefault();}catch(x){}
  try{e.stopPropagation();}catch(x){}
  var now=Date.now();
  if(now-lastTap>2600) taps=0;
  lastTap=now;
  taps++;
  clearTimeout(timer);
  timer=setTimeout(function(){taps=0;lastTap=0;},2600);
  if(taps>=5){
    taps=0;lastTap=0;clearTimeout(timer);
    setTimeout(abrirSenha,0);
  }
}
function bind(){
  marcar();
}
document.addEventListener('pointerdown',toque,{capture:true,passive:false});
document.addEventListener('touchstart',function(e){
  if(e.touches && e.touches.length===1 && ehTitulo(e.target)){
    try{e.preventDefault();}catch(x){}
  }
},{capture:true,passive:false});
bind();
setInterval(bind,500);
})();
</script>

<script>
(function(){
  'use strict';
  var orderById=new Map();
  var nextOrder=1;
  var rows=new WeakMap();

  function getId(dot){
    return String(dot.getAttribute('data-v20-dot-id')||dot.getAttribute('title')||'');
  }
  function registerOrder(dots){
    dots.forEach(function(dot){
      var id=getId(dot);
      if(id && !orderById.has(id)) orderById.set(id,nextOrder++);
    });
  }
  function sortByCreation(dots){
    registerOrder(dots);
    return dots.slice().sort(function(a,b){
      var ia=orderById.get(getId(a));
      var ib=orderById.get(getId(b));
      if(ia!==ib) return ia-ib;
      return 0;
    });
  }
  function openModal(row, state){
    var modal=document.createElement('div');
    modal.className='v20-dots-modal';
    modal.innerHTML='<div class="v20-dots-modal-card" role="dialog" aria-modal="true"><div class="v20-dots-modal-head"><span>Todos os dots</span><button type="button" class="v20-dots-modal-close" aria-label="Fechar">×</button></div><div class="v20-dots-modal-grid"></div></div>';
    document.body.appendChild(modal);
    var grid=modal.querySelector('.v20-dots-modal-grid');
    var closeBtn=modal.querySelector('.v20-dots-modal-close');
    function close(){modal.classList.remove('v20-open');document.body.style.overflow='';setTimeout(function(){if(modal.parentNode)modal.parentNode.removeChild(modal)},0)}
    function refresh(){
      grid.innerHTML='';
      var dots=(state.allDots||Array.from(row.querySelectorAll('.v20-gallery-dot-thumb'))).filter(function(x){return x&&x.classList&&x.classList.contains('v20-gallery-dot-thumb')});
      dots=sortByCreation(dots);
      dots.forEach(function(original){
        var clone=original.cloneNode(true);
        clone.classList.add('v20-modal-dot');
        clone.classList.remove('v20-dot-hidden');
        clone.style.setProperty('display','block','important');
        ['width','height','min-width','min-height','max-width','max-height','flex','flex-basis'].forEach(function(k){clone.style.removeProperty(k)});
        var cimg=clone.querySelector('img');
        if(cimg){
          cimg.removeAttribute('style');
          cimg.style.display='block';
          cimg.style.position='absolute';
          cimg.style.maxWidth='none';
          cimg.style.maxHeight='none';
          cimg.style.objectFit='fill';
          var dx=Number(original.getAttribute('data-v20-dot-x')), dy=Number(original.getAttribute('data-v20-dot-y'));
          if(Number.isFinite(dx)&&Number.isFinite(dy)){
            var applyCrop=function(){
              try{
                var W=cimg.naturalWidth,H=cimg.naturalHeight,box=clone.clientWidth||52;
                if(!W||!H||!box)return;
                var side=Math.min(W,H)*0.22,scale=box/side,iw=W*scale,ih=H*scale,cx=dx/100*iw,cy=dy/100*ih;
                cimg.style.width=iw+'px'; cimg.style.height=ih+'px';
                cimg.style.left=(box/2-cx)+'px'; cimg.style.top=(box/2-cy)+'px';
              }catch(e){}
            };
            cimg.onload=applyCrop;
            if(cimg.complete) applyCrop();
          }
        }
        clone.onclick=function(ev){
          ev.preventDefault();ev.stopPropagation();close();
          setTimeout(function(){try{original.click()}catch(e){}},30);
        };
        grid.appendChild(clone);
      });
    }
    closeBtn.onclick=function(ev){ev.preventDefault();ev.stopPropagation();close()};
    modal.onclick=function(ev){if(ev.target===modal)close()};
    document.addEventListener('keydown',function esc(ev){if(ev.key==='Escape'){close();document.removeEventListener('keydown',esc)}});
    refresh();
    modal.classList.add('v20-open');
    document.body.style.overflow='hidden';
  }
  function installRow(row){
    if(!row || !row.querySelector('.v20-gallery-dot-thumb')) return;
    var dots=Array.from(row.querySelectorAll('.v20-gallery-dot-thumb')).filter(function(x){return x.classList&&x.classList.contains('v20-gallery-dot-thumb')});
    if(!dots.length) return;
    registerOrder(dots);
    row.classList.add('v20-gallery-dot-row');
    var old=row.querySelectorAll('.v20-show-all-dots');
    old.forEach(function(x){x.remove()});
    var state=rows.get(row)||{};
    state.allDots=dots.slice();
    var btn=document.createElement('button');
    btn.type='button';btn.className='v20-show-all-dots';btn.textContent='+';btn.title='Mostrar todos';
    state.btn=btn;rows.set(row,state);

    var ordered=sortByCreation(dots);
    ordered.forEach(function(dot){
      var id=getId(dot);
      try{
        var stateDot=(state.allDots||[]).find(function(x){return getId(x)===id});
        if(stateDot){
          /* Preserve source coordinates without changing the visual dot geometry. */
        }
      }catch(e){}
      /* Reordering the DOM is intentional: gallery visibility must follow creation order. */
      row.appendChild(dot);
    });
    var w=row.clientWidth||row.getBoundingClientRect().width||200;
    var gap=6;
    var slots=ordered.length>4?5:Math.max(1,ordered.length);
    var size=Math.floor((w-gap*(slots-1))/slots);
    size=Math.max(12,Math.min(48,size));
    row.style.setProperty('--v20-dot-size',size+'px');
    ordered.forEach(function(dot,i){
      dot.setAttribute('data-v20-dot-order',String(i+1));
      dot.classList.toggle('v20-dot-hidden',i>=4 && ordered.length>4);
      ['width','height','min-width','min-height','max-width','max-height'].forEach(function(k){dot.style.setProperty(k,size+'px','important')});
      dot.style.setProperty('flex','0 0 '+size+'px','important');
      dot.style.setProperty('--v20-dot-size',size+'px');
      var img=dot.querySelector('img');
      if(img && img.complete){ try{ img.dispatchEvent(new Event('load')); }catch(e){} }
    });
    if(ordered.length>4){
      btn.style.setProperty('--v20-dot-size',size+'px');
      ['width','height','min-width','min-height'].forEach(function(k){btn.style.setProperty(k,size+'px','important')});
      btn.style.setProperty('flex','0 0 '+size+'px','important');
      btn.onclick=function(ev){ev.preventDefault();ev.stopPropagation();openModal(row,state)};
      row.appendChild(btn);
    }
  }
  function scan(){
    var seen=new Set();
    document.querySelectorAll('.v20-gallery-dot-thumb').forEach(function(dot){
      var row=dot.parentElement;
      if(row&&!seen.has(row)){seen.add(row);installRow(row)}
    });
  }
  var scheduled=false;
  function schedule(){
    if(scheduled)return;scheduled=true;requestAnimationFrame(function(){scheduled=false;scan()});
  }

  scan();

    var ro=new ResizeObserver(function(entries){entries.forEach(function(e){if(e.target&&e.target.querySelector&&e.target.querySelector('.v20-gallery-dot-thumb'))installRow(e.target)})});
    document.querySelectorAll('.v20-gallery-dot-thumb').forEach(function(dot){if(dot.parentElement)ro.observe(dot.parentElement)});
  }
})();
</script>

<script id="v20-adaptive-action-buttons-js">
(function(){
  'use strict';
  function refreshGalleryButtons(){
    document.querySelectorAll('.v20-gallery-action-row').forEach(function(row){
      var w=row.clientWidth||row.getBoundingClientRect().width||0;
      if(!w)return;
      var link=row.querySelector('.v20-gallery-action-link');
      var nova=row.querySelector('.v20-gallery-action-nova');
      var similar=row.querySelector('.v20-gallery-action-similar');
      var gap=5;
      var linkW=link?32:0;
      var gaps=(nova&&similar?gap:0)+(link?(gap*((nova?1:0)+(similar?1:0))):0);
      var flexible=row.querySelectorAll('.v20-gallery-action-btn').length;
      var available=w-linkW-gaps;
      var each=flexible?Math.max(24,Math.floor(available/flexible)):0;
      if(nova)nova.style.setProperty('width',each+'px','important');
      if(similar)similar.style.setProperty('width',each+'px','important');
    });
  }
  window.v20RefreshActionButtons=refreshGalleryButtons;
  function schedule(){
    requestAnimationFrame(function(){
      refreshGalleryButtons();
      requestAnimationFrame(refreshGalleryButtons);
    });
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',schedule,{once:true});
  }else schedule();
  window.addEventListener('resize',schedule,{passive:true});
})();
</script>
